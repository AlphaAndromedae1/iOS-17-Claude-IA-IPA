# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
name: ClaudeWeb

options:
  bundleIdPrefix: io.github.alphaandromedae1
  deploymentTarget:
    iOS: "16.4"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.7.0"
    CURRENT_PROJECT_VERSION: "11"
    SWIFT_VERSION: "5.0"

targets:
  ClaudeWeb:
    type: application
    platform: iOS
    sources:
      - path: ClaudeWeb
      # The iOS 17.3 style fix, loaded into the page at start-up.
      - path: Shared/style-fix.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: ClaudeWeb
        PRODUCT_BUNDLE_IDENTIFIER: io.github.alphaandromedae1.claudeweb
        INFOPLIST_FILE: Supporting/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    scheme: {}
