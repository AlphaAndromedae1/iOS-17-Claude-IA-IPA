name: Build IPA

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

# A release published on github.com also pushes its tag, which starts this workflow twice
# for the same ref. Run those one after the other so they don't race on the upload.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      # ldid signs the TrollStore IPA.
      - name: Install XcodeGen and ldid
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install xcodegen ldid

      - name: Build IPAs
        run: |
          ./scripts/build-ipa.sh
          test -f build/ClaudeWeb-TrollStore.ipa

      - name: Upload IPAs
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeWeb-ipa
          path: |
            build/ClaudeWeb.ipa
            build/ClaudeWeb-TrollStore.ipa
          if-no-files-found: error

      # Attaches the IPAs to the release for this tag, creating the release if it doesn't exist yet.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" build/ClaudeWeb.ipa build/ClaudeWeb-TrollStore.ipa \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" build/ClaudeWeb.ipa build/ClaudeWeb-TrollStore.ipa \
              --repo "$GITHUB_REPOSITORY" \
              --title "Claude Web $TAG" \
              --generate-notes
          fi
